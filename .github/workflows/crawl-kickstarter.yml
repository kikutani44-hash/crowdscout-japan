name: Crawl Kickstarter

on:
  workflow_dispatch:
    inputs:
      max_projects:
        description: 'Max projects per job (blank = no limit)'
        required: false
        default: '500'

jobs:
  crawl-magic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright requests python-dotenv anthropic
          playwright install chromium --with-deps
      - name: Crawl magic (popular)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          ARGS="--sort magic --pages 40 --force-translate"
          if [ -n "${{ github.event.inputs.max_projects }}" ]; then
            ARGS="$ARGS --max ${{ github.event.inputs.max_projects }}"
          fi
          python3 crawl_kickstarter.py $ARGS

  crawl-newest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright requests python-dotenv anthropic
          playwright install chromium --with-deps
      - name: Crawl newest (live campaigns)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          ARGS="--sort newest --pages 20 --force-translate"
          if [ -n "${{ github.event.inputs.max_projects }}" ]; then
            ARGS="$ARGS --max ${{ github.event.inputs.max_projects }}"
          fi
          python3 crawl_kickstarter.py $ARGS
