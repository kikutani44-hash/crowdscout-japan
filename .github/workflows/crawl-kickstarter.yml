name: Crawl Kickstarter

on:
  schedule:
    - cron: '0 18 * * *'   # 毎日 03:00 JST
  workflow_dispatch:
    inputs:
      max_projects:
        description: 'Max projects per job'
        required: false
        default: '500'

jobs:
  crawl-magic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright requests python-dotenv anthropic beautifulsoup4
          playwright install chromium --with-deps
      - name: Crawl magic (popular)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          python3 crawl_kickstarter.py --sort magic --pages 40 --max ${{ github.event.inputs.max_projects || '500' }} --force-translate

  crawl-newest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright requests python-dotenv anthropic beautifulsoup4
          playwright install chromium --with-deps
      - name: Crawl newest (live campaigns)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          python3 crawl_kickstarter.py --sort newest --pages 20 --max ${{ github.event.inputs.max_projects || '500' }} --force-translate

  crawl-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright requests python-dotenv anthropic beautifulsoup4
          playwright install chromium --with-deps
      - name: Crawl archive (お宝発掘 180-730日)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          python3 crawl_kickstarter.py --pages 60 --archive --max ${{ github.event.inputs.max_projects || '500' }} --force-translate
