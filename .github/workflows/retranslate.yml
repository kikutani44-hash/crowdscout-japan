name: Retranslate Missing

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '翻訳する最大件数'
        required: false
        default: '200'

jobs:
  retranslate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv anthropic
      - name: Retranslate untranslated projects
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          python3 retranslate_supabase.py --limit ${{ github.event.inputs.limit || '200' }}
